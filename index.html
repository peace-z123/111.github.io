<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易网页采集工具（仅测试公开数据）</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{padding:20px;max-width:1200px;margin:0 auto;background:#f5f7fa}
        .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #00000012;margin-bottom:16px}
        .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
        input,select,button,textarea{padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px}
        input{flex:1;min-width:260px}
        button{cursor:pointer;background:#2563eb;color:#fff;border:none}
        button:disabled{background:#94a3b8;cursor:not-allowed}
        textarea{width:100%;min-height:220px;margin-top:10px;font-family:monospace}
        .tip{color:#dc2626;font-size:13px;margin:8px 0}
        .success{color:#16a34a}
    </style>
</head>
<body>
    <div class="card">
        <h2>简易在线采集器（前端版）</h2>
        <p class="tip">⚠️ 仅用于测试允许公开访问、允许跨域的数据；受浏览器跨域限制，大部分网站会失败；爬虫请遵守法律法规与网站协议</p>
        <div class="row">
            <input id="targetUrl" placeholder="输入要抓取的网址，例如 https://xxx.com/api/data">
            <select id="method">
                <option value="GET">GET</option>
                <option value="POST">POST</option>
            </select>
            <button id="fetchBtn">开始抓取</button>
        </div>
        <div class="row">
            <label>POST参数(json)：</label>
            <textarea id="postBody" placeholder='{"name":"test"}'></textarea>
        </div>
        <div>
            <label>返回结果：</label>
            <textarea id="result" readonly></textarea>
        </div>
    </div>

<script>
const fetchBtn = document.getElementById('fetchBtn');
const targetUrl = document.getElementById('targetUrl');
const methodSel = document.getElementById('method');
const postBody = document.getElementById('postBody');
const resultDom = document.getElementById('result');

// 公共CORS代理，仅用于学习测试，不稳定，随时失效
const proxy = "https://corsproxy.io/?";

fetchBtn.onclick = async ()=>{
    const url = targetUrl.value.trim();
    if(!url){
        resultDom.value = "请填写目标网址";
        return;
    }
    fetchBtn.disabled = true;
    resultDom.value = "请求中...";
    try{
        const reqOpt = {
            method: methodSel.value
        }
        if(methodSel.value === 'POST' && postBody.value.trim()){
            reqOpt.headers = {"Content-Type":"application/json"};
            reqOpt.body = postBody.value.trim();
        }
        const res = await fetch(proxy + encodeURIComponent(url), reqOpt);
        const text = await res.text();
        resultDom.value = `状态码：${res.status}\n\n${text}`;
    }catch(e){
        resultDom.value = `请求失败：${e.message}\n\n代理可能失效，或者目标网站禁止抓取`;
    }
    fetchBtn.disabled = false;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.7;
            padding-bottom: 120px;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }
        header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        header p {
            opacity: 0.9;
            font-size: 16px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: #fff;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .card h2 {
            color: #555;
            margin-bottom: 12px;
            font-size: 22px;
        }
        .card .time {
            color: #999;
            font-size: 13px;
            margin-bottom: 14px;
        }
        .card p {
            color: #444;
        }
        footer {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 20px;
        }

        /* ===== 右下角悬浮音乐播放器 ===== */
        .music-box {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #fff;
            padding: 14px 18px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap:10px;
            z-index: 999;
        }
        .music-box button {
            border: none;
            background: #667eea;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            font-size:16px;
        }
        .music-info {
            font-size:13px;
            max-width:120px;
            white-space: nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .music-box select {
            border:1px solid #ddd;
            border-radius:6px;
            padding:3px;
            font-size:12px;
        }
        .music-box input[type="range"] {
            width:70px;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的小博客</h1>
        <p>记录日常、想法与生活碎片</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>第一篇随笔</h2>
            <div class="time">发布于 2026-10-28</div>
            <p>日子慢慢走，认真感受身边的小事。保持热爱，稳步向前，把普通的生活过得舒服一点。</p>
        </div>
        <div class="card">
            <h2>随记</h2>
            <div class="time">发布于 2026-10-27</div>
            <p>很多事情不必急于求成，沉下心做好当下，时间会给出答案。</p>
        </div>
        <div class="card">
            <h2>读书感悟</h2>
            <div class="time">发布于 2026-10-25</div>
            <p>阅读是最低成本的远行，在文字里看见不同的世界，理解不一样的想法。</p>
        </div>
    </div>

    <footer>© 2026 我的个人博客</footer>

    <!-- 悬浮音乐播放器 -->
    <div class="music-box">
        <button id="playBtn">▶</button>
        <div class="music-info" id="musicName">测试热歌</div>
        <select id="musicSelect">
            <option value="https://mdn.github.io/learning-area/html/multimedia-and-embedding/tasks/media-embed/media/audio.mp3">示例轻音乐1</option>
            <option value="https://jplayer.org/audio/mp3/Miaow-01-Tempered-song.mp3">示例轻音乐2</option>
            <option value="https://media.geeksforgeeks.org/wp-content/uploads/20241009180552641558/sample-12s.mp3">示例轻音乐3</option>
        </select>
        <input type="range" id="vol" min="0" max="1" step="0.05" value="0.6">
        <audio id="audio" preload="auto">
    </div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const musicSelect = document.getElementById('musicSelect');
    const musicName = document.getElementById('musicName');
    const volInput = document.getElementById('vol');

    // 加载音乐
    function loadMusic(src, name){
        audio.src = src;
        musicName.innerText = name;
    }
    // 默认加载第一首
    loadMusic(musicSelect.value, musicSelect.options[0].text);

    // 播放暂停
    playBtn.onclick = async ()=>{
        if(audio.paused){
            try{
                await audio.play();
                playBtn.innerText = "⏸";
            }catch(err){
                alert("播放失败，请检查网络");
            }
        }else{
            audio.pause();
            playBtn.innerText = "▶";
        }
    }

    // 切换歌曲
    musicSelect.onchange = async ()=>{
        const opt = musicSelect.options[musicSelect.selectedIndex];
        loadMusic(opt.value, opt.text);
        try{
            await audio.play();
            playBtn.innerText = "⏸";
        }catch(e){}
    }

    // 音量调节
    volInput.oninput = ()=>{
        audio.volume = volInput.value;
    }

    // 播放结束自动切下一首
    audio.onended = async ()=>{
        let idx = musicSelect.selectedIndex + 1;
        if(idx >= musicSelect.options.length) idx = 0;
        musicSelect.selectedIndex = idx;
        const opt = musicSelect.options[idx];
        loadMusic(opt.value, opt.text);
        try{
            await audio.play();
            playBtn.innerText = "⏸";
        }catch(e){
            playBtn.innerText = "▶";
        }
    }
</script>
</body>
</html>
